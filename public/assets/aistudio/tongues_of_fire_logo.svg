<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="60%" stop-color="#140404" />
      <stop offset="100%" stop-color="#0a0202" />
    </radialGradient>
    
    <radialGradient id="fireCenter" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="25%" stop-color="#ffb703" />
      <stop offset="60%" stop-color="#fb8500" />
      <stop offset="85%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#7a0010" />
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="innerTongue" x1="50%" y1="90%" x2="50%" y2="10%">
      <stop offset="0%" stop-color="#d90429" />
      <stop offset="40%" stop-color="#f77f00" />
      <stop offset="80%" stop-color="#fcbf49" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Circular Base -->
  <rect width="800" height="800" fill="#0d0404" />
  <circle cx="400" cy="400" r="375" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="6" />
  <circle cx="400" cy="400" r="355" fill="none" stroke="#d90429" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Outer Ambient Fire Glow -->
  <circle cx="400" cy="380" r="160" fill="#f77f00" opacity="0.18" filter="url(#glowEffect)" />

  <!-- Stylized Flaming Tongues Icon Structure -->
  <g id="flamingTongue" filter="url(#glowEffect)">
    <!-- Back Outer Flame Waves -->
    <path d="M 400 130 
             C 435 210, 520 270, 510 380 
             C 500 480, 420 540, 400 550 
             C 380 540, 300 480, 290 380 
             C 280 270, 365 210, 400 130 Z" 
          fill="url(#fireCenter)" />

    <!-- Left Wing Flame -->
    <path d="M 400 240 
             C 340 280, 260 340, 275 430 
             C 290 510, 360 545, 400 550 
             C 370 510, 345 440, 360 380 
             C 370 330, 390 280, 400 240 Z" 
          fill="#d90429" opacity="0.85" />

    <!-- Right Wing Flame -->
    <path d="M 400 240 
             C 460 280, 540 340, 525 430 
             C 510 510, 440 545, 400 550 
             C 430 510, 455 440, 440 380 
             C 430 330, 410 280, 400 240 Z" 
          fill="#d90429" opacity="0.85" />

    <!-- Core Radiant Flame / Inner White-Hot Tongue of Fire -->
    <path d="M 400 190 
             C 420 250, 465 310, 455 390 
             C 445 460, 415 495, 400 510 
             C 385 495, 355 460, 345 390 
             C 335 310, 380 250, 400 190 Z" 
          fill="url(#innerTongue)" />

    <!-- Central White Hot Core Tip -->
    <path d="M 400 270 
             C 412 320, 430 360, 420 420 
             C 410 460, 403 475, 400 480 
             C 397 475, 390 460, 380 420 
             C 370 360, 388 320, 400 270 Z" 
          fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Divine Cross Accent within Flame Base -->
  <g transform="translate(400, 415)">
    <line x1="0" y1="-32" x2="0" y2="35" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <line x1="-22" y1="-12" x2="22" y2="-12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Upper Banner Arc Text: TONGUES OF FIRE -->
  <path id="textArcTop" d="M 170 280 A 285 285 0 0 1 630 280" fill="none" />
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="9" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">
      TONGUES OF FIRE
    </textPath>
  </text>

  <!-- Lower Banner Arc Text: MINISTRIES -->
  <path id="textArcBottom" d="M 210 600 A 280 280 0 0 0 590 600" fill="none" />
  <text fill="#fef08a" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="10" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">
      MINISTRIES
    </textPath>
  </text>

  <!-- Sub-inscription & Emblem Stamp -->
  <text x="400" y="650" fill="#fca311" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5" text-anchor="middle">
    OFFICIAL MINISTRY EMBLEM
  </text>

  <!-- Decorative Accent Stars -->
  <polygon points="175,340 180,352 193,354 183,363 186,375 175,368 164,375 167,363 157,354 170,352" fill="#eab308" />
  <polygon points="625,340 630,352 643,354 633,363 636,375 625,368 614,375 617,363 607,354 620,352" fill="#eab308" />
</svg>
